[workspace]
resolver = "2"
members = [
    "crates/xlit-core",
    "crates/xlit-dict",
    "crates/xlit-learn",
    "crates/xlit-cli",
    "crates/xlit-config",
    "crates/xlit-install",
    "frontends/windows-tsf",
    "frontends/linux-ibus",
    "frontends/linux-fcitx5",
]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
repository = ""

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
