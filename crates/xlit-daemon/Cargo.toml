[package]
name = "xlit-daemon"
version = "0.1.1"
description = "One process that owns the transliteration engine; frontends are thin IPC clients."
edition.workspace = true
license.workspace = true

[[bin]]
name = "xlit-daemon"
path = "src/main.rs"

[dependencies]
xlit-core = { path = "../xlit-core" }
xlit-dict = { path = "../xlit-dict" }
xlit-learn = { path = "../xlit-learn" }
xlit-ipc = { path = "../xlit-ipc" }
