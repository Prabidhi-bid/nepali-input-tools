[package]
name = "xlit-install"
version = "0.1.1"
description = "Installer for the xlit Windows text service: copies the DLLs and registers the TIP through the TSF APIs."
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "xlit-install"
path = "src/main.rs"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
]
