[package]
name = "xlit-config"
version = "0.1.0"
description = "Word editor for the xlit input method: teach it words it gets wrong."
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "xlit-config"
path = "src/main.rs"

[dependencies]
xlit-core = { path = "../xlit-core" }
xlit-dict = { path = "../xlit-dict" }
xlit-learn = { path = "../xlit-learn" }

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Networking_WinHttp",
    "Win32_System_LibraryLoader",
    "Win32_UI_Controls",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]
